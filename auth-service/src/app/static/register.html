<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Service Portal</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        /* Hide auth card by default to prevent UI flickering */
        .auth-card {
            display: none;
        }
    </style>
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-header">
            <h1>Create Account</h1>
            <p>Fill in the form below to register</p>
        </div>

        <div id="alertBox" class="alert-box alert-error"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" minlength="6" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>

        <a href="/api/v1/auth/google/login" class="btn btn-google">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Sign up with Google
        </a>

        <div class="auth-footer">
            Already have an account? <a href="/login">Sign in</a>
        </div>
    </div>

    <script>
        async function checkAuthAndRedirect() {
            let token = localStorage.getItem('access_token');

            // 1. Verify existing access_token via /me
            if (token) {
                try {
                    const resMe = await fetch('/api/v1/auth/me', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (resMe.ok) {
                        window.location.replace('/dashboard');
                        return;
                    }
                } catch (err) {
                    console.log("Access token invalid or expired.");
                }
            }

            // 2. Attempt token refresh using HttpOnly cookie
            try {
                const resRefresh = await fetch('/api/v1/auth/refresh', { method: 'POST' });

                if (resRefresh.ok) {
                    const data = await resRefresh.json();
                    localStorage.setItem('access_token', data.access_token);
                    window.location.replace('/dashboard');
                    return;
                }
            } catch (err) {
                console.log("No valid refresh session found.");
            }

            // 3. User is unauthenticated — display registration card
            localStorage.removeItem('access_token');
            document.querySelector('.auth-card').style.display = 'block';
        }

        checkAuthAndRedirect();

        const alertBox = document.getElementById('alertBox');

        function showAlert(message) {
            alertBox.textContent = message;
            alertBox.style.display = 'block';
        }

        function hideAlert() {
            alertBox.style.display = 'none';
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showAlert('Passwords do not match');
                return;
            }

            try {
                // 1. Execute registration
                const regResponse = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (regResponse.status === 429) {
                    throw new Error('Too many registration attempts! Please wait a bit (429).');
                }

                const regData = await regResponse.json();
                if (!regResponse.ok) throw new Error(regData.detail || 'Registration failed');

                // 2. Auto-login immediately after successful registration
                const loginResponse = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const loginData = await loginResponse.json();
                if (!loginResponse.ok) throw new Error(loginData.detail || 'Login failed after registration');

                localStorage.setItem('access_token', loginData.access_token);
                window.location.replace('/dashboard');

            } catch (err) {
                showAlert(err.message);
            }
        });
    </script>
</body>
</html>
