<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Установка пароля</title>
</head>
<body>
    <h2>Создайте пароль для вашего аккаунта</h2>
    <form id="setPasswordForm">
        <input type="password" id="newPassword" placeholder="Новый пароль" required minlength="6">
        <button type="submit">Сохранить пароль</button>
    </form>

    <script>
        document.getElementById('setPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('access_token');
            const newPassword = document.getElementById('newPassword').value;

            const res = await fetch('/api/v1/auth/set-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ new_password: newPassword })
            });

            if (res.ok) {
                alert('Пароль успешно установлен!');
                window.location.href = '/dashboard.html';
            } else {
                alert('Ошибка при установке пароля.');
            }
        });
    </script>
</body>
</html>
