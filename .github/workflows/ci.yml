name: Run Tests and Checks

on:
  pull_request:
    branches: [ "dev" ] # Запускать проверки только при PR в ветку dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14' # Укажите нужную версию Python

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # если есть файл зависимостей, раскомментируйте следующую строку:
        # if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run code inspection / tests
      run: |
        # Здесь пишется команда запуска ваших тестов (например, pytest или python main.py)
        python -c "print('All checks passed successfully!')"